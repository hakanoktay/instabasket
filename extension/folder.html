<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KeepKeep</title>
  <link rel="stylesheet" href="folder.css">
</head>
<body>
  <main>
    <img class="logo" src="icons/logo.svg" alt="KeepKeep">
    <h1 id="title">Choose your download folder</h1>
    <p id="text">Photos and videos will be saved there directly, as separate files.</p>
    <button id="go" class="option primary"><b id="go-label">Choose a folder…</b></button>
    <button id="cancel" class="link">Cancel</button>
    <p id="error" hidden></p>
  </main>
  <script src="folderstore.js"></script>
  <script src="folder.js"></script>
</body>
</html>
