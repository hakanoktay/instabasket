<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.6 9.1a2 2 0 0 1-2 1.6H7.6a2 2 0 0 1-2-1.6z"/><path d="M2.5 10h19M8 10l3-6M16 10l-3-6"/></svg></span>InstaBasket</h1>
    <div class="header-actions">
      <button id="add-current" class="btn primary" hidden>+ Add this page</button>
      <button id="download-settings" class="icon-btn" title="Where downloads are saved"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v12M7 10.5l5 5 5-5"/><path d="M4 16.5v2a2.5 2.5 0 0 0 2.5 2.5h11a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg></span></button>
    </div>
  </header>
  <p id="add-result" hidden></p>

  <nav>
    <button class="tab" data-tab="profiles">Profiles <span id="profiles-count"></span></button>
    <button class="tab" data-tab="media">Media <span id="media-count"></span></button>
  </nav>

  <div id="lists">
    <div class="chips-wrap">
      <button class="scroll-btn left" title="Scroll left" hidden><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span></button>
      <div class="chips"></div>
      <button class="scroll-btn right" title="Scroll right" hidden><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
    </div>
    <button id="new-list" class="chip add" title="New list"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <form id="new-list-form" hidden>
      <input placeholder="New list name" maxlength="40" required>
      <button type="submit" class="btn primary">Create</button>
      <button type="button" class="btn cancel">Cancel</button>
    </form>
  </div>

  <section id="profiles">
    <p class="empty"></p>
    <ul class="profiles"></ul>
  </section>

  <section id="media" hidden>
    <div id="filter" hidden>
      <span></span>
      <button class="icon-btn" title="Clear filter"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
    </div>
    <p class="empty"></p>
    <div class="groups"></div>
  </section>

  <!-- Shown while a list is selected: its name and the rename / delete actions. -->
  <footer id="list-footer" hidden>
    <div class="view">
      <span class="list-name"></span>
      <button class="btn rename">Rename</button>
      <button class="btn danger delete">Delete list</button>
    </div>
    <form class="rename-form" hidden>
      <input maxlength="40" required>
      <button type="submit" class="btn primary">Save</button>
      <button type="button" class="btn cancel">Cancel</button>
    </form>
    <div class="confirm" hidden>
      <span class="question"></span>
      <button class="btn cancel">Cancel</button>
      <button class="btn danger-fill confirm-delete">Delete</button>
    </div>
  </footer>

  <div id="picker" hidden></div>

  <script src="basket.js"></script>
  <script src="popup.js"></script>
</body>
</html>
