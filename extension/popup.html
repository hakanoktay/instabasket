<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🧺 InstaBasket</h1>
    <button id="add-current" class="primary" hidden>+ Bu sayfayı ekle</button>
  </header>
  <p id="add-result" hidden></p>

  <nav>
    <button class="tab" data-tab="profiles">Profiller <span id="profiles-count"></span></button>
    <button class="tab" data-tab="media">Görseller <span id="media-count"></span></button>
  </nav>

  <section id="profiles">
    <p class="empty">Henüz profil yok. Instagram'da bir profilin ya da gönderinin linkini sürükleyip köşede açılan kutuya bırak.</p>
    <ul class="profiles"></ul>
  </section>

  <section id="media" hidden>
    <div id="filter" hidden>
      <span></span>
      <button title="Filtreyi kaldır">✕</button>
    </div>
    <p class="empty">Henüz görsel yok. Bir gönderi, reel ya da video linkini sürükleyip bırak; sahibi de profillere eklenir.</p>
    <div class="groups"></div>
  </section>

  <footer>
    <button id="copy">Linkleri kopyala</button>
    <button id="clear">Tümünü temizle</button>
  </footer>

  <script src="basket.js"></script>
  <script src="popup.js"></script>
</body>
</html>
