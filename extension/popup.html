<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🧺 InstaBasket</h1>
    <button id="add-current" class="primary" hidden>+ Add this page</button>
  </header>
  <p id="add-result" hidden></p>

  <nav>
    <button class="tab" data-tab="profiles">Profiles <span id="profiles-count"></span></button>
    <button class="tab" data-tab="media">Media <span id="media-count"></span></button>
  </nav>

  <section id="profiles">
    <p class="empty">No profiles yet. On Instagram, drag a profile or post link and drop it into the box that appears in the corner.</p>
    <ul class="profiles"></ul>
  </section>

  <section id="media" hidden>
    <div id="filter" hidden>
      <span></span>
      <button title="Clear filter">✕</button>
    </div>
    <p class="empty">No media yet. Drag and drop a post, reel or video link; its owner is added to profiles too.</p>
    <div class="groups"></div>
  </section>

  <footer>
    <button id="copy">Copy links</button>
    <button id="clear">Clear all</button>
  </footer>

  <script src="basket.js"></script>
  <script src="popup.js"></script>
</body>
</html>
