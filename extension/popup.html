<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="main-view" class="pane">
  <header>
    <h1><img class="logo" src="icons/logo.svg" alt="">KeepKeep</h1>
    <!-- Act on the post / profile open in the current tab. -->
    <div class="header-actions">
      <div class="page-actions" hidden>
        <button class="icon-btn page-btn" data-action="profile" hidden></button>
        <button class="icon-btn page-btn" data-action="media" hidden></button>
        <button class="icon-btn page-btn" data-action="download" hidden></button>
      </div>
      <button id="settings" class="icon-btn" title="Download settings"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span></button>
    </div>
  </header>

  <nav>
    <button class="tab" data-tab="profiles">Profiles <span id="profiles-count"></span></button>
    <button class="tab" data-tab="media">Media <span id="media-count"></span></button>
  </nav>

  <div id="lists">
    <div class="chips-wrap">
      <button class="scroll-btn left" title="Scroll left" hidden><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span></button>
      <div class="chips"></div>
      <button class="scroll-btn right" title="Scroll right" hidden><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
    </div>
    <button id="new-list" class="chip add" title="New list"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <form id="new-list-form" hidden>
      <input placeholder="New list name" maxlength="40" required>
      <button type="submit" class="btn primary">Create</button>
      <button type="button" class="btn cancel">Cancel</button>
    </form>
  </div>

  <section id="profiles">
    <p class="empty"></p>
    <ul class="profiles"></ul>
  </section>

  <section id="media" hidden>
    <div id="filter" hidden>
      <span></span>
      <button class="icon-btn" title="Clear filter"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
    </div>
    <p class="empty"></p>
    <div class="groups"></div>
  </section>

  <!-- Shown while a list is selected: its name and the rename / delete actions. -->
  <footer id="list-footer" hidden>
    <div class="view">
      <span class="list-name"></span>
      <button class="btn rename">Rename</button>
      <button class="btn danger delete">Delete list</button>
    </div>
    <form class="rename-form" hidden>
      <input maxlength="40" required>
      <button type="submit" class="btn primary">Save</button>
      <button type="button" class="btn cancel">Cancel</button>
    </form>
    <div class="confirm" hidden>
      <span class="question"></span>
      <button class="btn cancel">Cancel</button>
      <button class="btn danger-fill confirm-delete">Delete</button>
    </div>
  </footer>

  <div id="picker" hidden></div>
</div>

<!-- Settings: slides in from the right when ⚙ is pressed. -->
<div id="settings-view" class="pane" aria-hidden="true">
  <header class="settings-header">
    <button id="settings-back" class="icon-btn" title="Back"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span></button>
    <h1>Settings</h1>
  </header>

  <div class="settings-body">
    <h2>Downloads</h2>
    <p class="settings-hint">Where photos and videos go when you press Download.</p>

    <label class="setting-option" id="opt-folder">
      <input type="radio" name="download-mode" value="folder">
      <span class="text">
        <b>My own folder</b>
        <span class="desc">Saved straight into the folder, as separate files. No save window, no ZIP.</span>
        <span class="folder-line" hidden><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2.5h9A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg></span><span class="folder-name"></span></span>
        <span class="warn" hidden>Chrome needs you to allow access to this folder again.</span>
        <span class="actions">
          <button type="button" class="btn small" id="choose-folder">Choose folder…</button>
          <button type="button" class="btn small primary" id="allow-folder" hidden>Allow access…</button>
        </span>
      </span>
    </label>

    <label class="setting-option" id="opt-zip">
      <input type="radio" name="download-mode" value="zip">
      <span class="text">
        <b>Downloads folder</b>
        <span class="desc">Saved to Downloads/KeepKeep. Albums are saved as one ZIP file.</span>
      </span>
    </label>

    <p class="settings-note">Choosing a folder opens a small window: Chrome only allows extensions to open the folder picker there.</p>
  </div>

  <footer class="settings-footer"><img class="logo" src="icons/logo.svg" alt=""> KeepKeep <span class="version"></span></footer>
</div>

  <script src="basket.js"></script>
  <script src="folderstore.js"></script>
  <script src="popup.js"></script>
</body>
</html>
