<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import a backup – KeepKeep</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="welcome.css">
<link rel="stylesheet" href="import.css">
</head>
<body>
<main>
  <div class="brand"><img src="icons/logo.svg" alt="" width="40" height="40"><span>KeepKeep</span></div>

  <h1 class="page-title">Import a backup</h1>
  <p class="lead">Choose a KeepKeep backup file (<b>KeepKeep-backup-….json</b>, made with Export in KeepKeep's settings). Everything in it is added to what you have here – nothing is deleted.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".json,application/json">
    <svg viewBox="0 0 24 24"><path d="M12 15.5v-12M7 8.5l5-5 5 5"/><path d="M4 16.5v2a2.5 2.5 0 0 0 2.5 2.5h11a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg>
    <b>Choose a backup file</b>
    <span>or drop it here</span>
  </label>

  <div id="result" class="result" role="status" hidden></div>
</main>
<script src="basket.js"></script>
<script src="import.js"></script>
</body>
</html>
